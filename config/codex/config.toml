[tui]
status_line = ["model-with-reasoning", "current-dir", "project-name", "git-branch", "context-used", "run-state", "permissions", "five-hour-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 2

[memories]
generate_memories = true
use_memories = true
# [hooks.state] trusted hashes are machine/repo-specific — see config.local.toml.
[desktop]
ambient-suggestions-enabled = false
codeFontSize = 13
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
git-show-sidebar-pr-icons = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
dock-icon-preference = "codex-system"
git-branch-prefix = "akoken/"
git-always-force-push = false
git-pull-request-merge-method = "squash"

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
contrast = 60
ink = "#ffffff"
opaqueWindows = false
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]
code = "MonaLisa"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[shell_environment_policy.set]
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "9230e2bd8b24b7ac7a0ba6774c64bf0d78ecdabbdd91d0ed627b02a587bae2df"

[apps.connector_openai_codex_document_control]
enabled = false
