model = "gpt-6-astra"
model_reasoning_effort = "low"
personality = "pragmatic"

# `notify` is an absolute, machine-specific app path — see config.local.toml
# (and config.local.toml.example for the shape).

[model_providers.llama_cpp]
name      = "llama.cpp"
base_url  = "http://localhost:8081/v1"
env_key   = "LLAMA_CPP_API_KEY"
wire_api  = "responses"

[agents]
max_depth = 1
max_threads = 6

[features]
hooks = true
computer_use = false
multi_agent = true
terminal_resize_reflow = true
memories = true
js_repl = false

# openai-bundled and openai-primary-runtime are local-source marketplaces
# pointing at machine-specific cache paths — see config.local.toml.

[marketplaces.caveman]
last_updated = "2026-08-21T09:10:40Z"
last_revision = "2f49f0e1a352aa810e70056b7930aeb0b3d219b4"
source_type = "git"
source = "https://github.com/JuliusBrussee/caveman.git"

[marketplaces.claude-plugins-official]
last_updated = "2026-08-21T09:10:44Z"
last_revision = "67a666efc8524ff7abaa266f84e514aa77aee48f"
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[mcp_servers.MCP_DOCKER]
args = [
    "mcp",
    "gateway",
    "run",
]
command = "docker"

[mcp_servers.context7]
args = [
    "-y",
    "@upstash/context7-mcp",
]
command = "npx"
startup_timeout_sec = 20

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/akoken/.config/codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/akoken/.config/codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.901.41123"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/akoken/.config/codex/plugins/cache/openai-bundled/browser/26.901.41123/scripts/browser-service.mjs"}'
#NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
#NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
#NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = "Control desktop apps on macOS through Computer Use."
#BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
#BROWSER_USE_CODEX_APP_VERSION = "26.810.41047"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

#[mcp_servers.computer-use]
#command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
#args = ["mcp"]
#cwd = "."
#enabled = false

