model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"

# `notify` is an absolute, machine-specific app path — see config.local.toml
# (and config.local.toml.example for the shape).

[model_providers.llama_cpp]
name      = "llama.cpp"
base_url  = "http://localhost:8081/v1"
env_key   = "LLAMA_CPP_API_KEY"
wire_api  = "responses"

[agents]
max_depth = 1
max_threads = 6

[features]
hooks = true
computer_use = false
multi_agent = true
terminal_resize_reflow = true
memories = true
js_repl = false

# openai-bundled and openai-primary-runtime are local-source marketplaces
# pointing at machine-specific cache paths — see config.local.toml.

[marketplaces.caveman]
last_updated = "2026-08-21T09:10:40Z"
last_revision = "2f49f0e1a352aa810e70056b7930aeb0b3d219b4"
source_type = "git"
source = "https://github.com/JuliusBrussee/caveman.git"

[marketplaces.claude-plugins-official]
last_updated = "2026-08-21T09:10:44Z"
last_revision = "67a666efc8524ff7abaa266f84e514aa77aee48f"
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[mcp_servers.MCP_DOCKER]
args = [
    "mcp",
    "gateway",
    "run",
]
command = "docker"

[mcp_servers.context7]
args = [
    "-y",
    "@upstash/context7-mcp",
]
command = "npx"
startup_timeout_sec = 20

[mcp_servers.cua_repl]
command = "/Applications/ChatGPT.app/Contents/MacOS/ChatGPT"
enabled = false

#[mcp_servers.computer-use]
#command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
#args = ["mcp"]
#cwd = "."
#enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."codex-security@openai-curated"]
enabled = true

[plugins."caveman@caveman-repo"]
enabled = true

[plugins."build-macos-apps@openai-curated"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."caveman@caveman"]
enabled = false

[plugins."rust-analyzer-lsp@claude-plugins-official"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

# Per-machine trusted-project entries live in config.local.toml.

[tui]
status_line = ["model-with-reasoning", "current-dir", "project-name", "git-branch", "context-used", "run-state", "permissions", "five-hour-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[memories]
generate_memories = true
use_memories = true
# [hooks.state] trusted hashes are machine/repo-specific — see config.local.toml.
[desktop]
ambient-suggestions-enabled = false
codeFontSize = 13
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
git-show-sidebar-pr-icons = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
dock-icon-preference = "codex-system"
git-branch-prefix = "akoken/"
git-always-force-push = false
git-pull-request-merge-method = "squash"

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
contrast = 60
ink = "#ffffff"
opaqueWindows = false
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]
code = "MonaLisa"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[shell_environment_policy.set]
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "9230e2bd8b24b7ac7a0ba6774c64bf0d78ecdabbdd91d0ed627b02a587bae2df"

[apps.connector_openai_codex_document_control]
enabled = false
