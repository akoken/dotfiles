name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint shell scripts
        run: |
          # bin/ mixes shell scripts with native binaries (e.g. git-graph),
          # so pick out only the shell scripts by file type.
          mapfile -t scripts < <(file bin/* | awk -F': ' '/shell script/{print $1}')
          shellcheck -S warning install.sh githooks/pre-commit "${scripts[@]}"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  brewfile:
    name: Brewfile syntax (no installs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Parse all Brewfile entries
        # Validate the Bundle DSL without requiring packages on a fresh runner.
        # This checks parsing, not package availability or installation state.
        run: brew bundle list --file=Brewfile --all

  docker-smoke:
    name: Docker install.sh smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build test image
        run: docker build -t dotfiles-ci --force-rm .
      - name: backup / link (twice, idempotency) / clean / copy / --dry-run
        run: |
          docker run --rm dotfiles-ci bash -lc '
            set -e
            cd dotfiles
            ./install.sh backup
            ./install.sh link
            ./install.sh link
            test -L "$HOME/.zshenv"
            test -L "$HOME/bin"
            test -f "$HOME/.config/codex/config.toml"
            ./install.sh clean
            test ! -L "$HOME/.zshenv"
            test ! -L "$HOME/bin"
            ./install.sh copy
            ./install.sh --dry-run link
            ./install.sh link
            test -d "$HOME/bin"
            test ! -L "$HOME/bin"
            diff -r bin "$HOME/bin"
          '
